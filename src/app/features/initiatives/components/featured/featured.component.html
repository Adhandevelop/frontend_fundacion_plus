<article class="initiative-panel border rounded-xl overflow-hidden grid lg:grid-cols-2">
 <div class="min-h-80 bg-slate-200">@if(initiative().image){<img [src]="initiative().image" [alt]="initiative().imageAlt||initiative().title" class="w-full h-full object-cover">}@else{<div class="h-full grid place-items-center p-8 text-center">Iniciativa institucional sin portada</div>}</div>
 <div class="p-6 lg:p-8 flex flex-col justify-center gap-4"><div><span class="inline-flex rounded-full bg-primary-container text-black px-3 py-1 text-label-sm">Iniciativa destacada</span><p class="text-label-sm uppercase tracking-wider mt-4">{{initiative().category}}</p><h2 class="text-headline-md mt-2">{{initiative().title}}</h2></div><p class="text-body-md">{{initiative().summary}}</p><div class="grid sm:grid-cols-2 gap-3 text-body-sm"><p class="border rounded-lg p-3">{{initiative().impact}}</p><p class="border rounded-lg p-3">{{initiative().coverage}}</p></div><button type="button" class="initiative-button self-start" (click)="gallery.emit(initiative())">Ver programa y galería</button></div>
</article>
