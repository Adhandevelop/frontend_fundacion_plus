<article class="initiative-panel border rounded-xl overflow-hidden flex flex-col h-full hover:shadow-md transition-shadow">
  <div class="relative h-48 overflow-hidden"><img [src]="initiative().image" [alt]="initiative().title" loading="lazy" class="w-full h-full object-cover"><span class="absolute top-3 left-3 px-3 py-1 rounded-full bg-white/95 text-slate-950 text-label-sm font-semibold">{{initiative().period}}</span></div>
  <div class="p-space-lg flex-1 flex flex-col justify-between">
    <div><p class="text-label-sm uppercase tracking-wider opacity-75 mb-2">{{initiative().category}}</p><h3 class="text-title-md font-semibold mb-2">{{initiative().title}}</h3><p class="text-body-sm opacity-80 mb-5">{{initiative().summary}}</p></div>
    <div class="pt-3 border-t border-slate-400/40"><div class="flex flex-wrap justify-between gap-2 text-label-sm mb-4"><span>{{initiative().impact}}</span><span>{{initiative().coverage}}</span></div><button type="button" class="initiative-button w-full flex items-center justify-center gap-2" (click)="gallery.emit(initiative())"><span class="material-symbols-outlined text-[18px]" aria-hidden="true">photo_library</span>Explorar memoria y fotos</button></div>
  </div>
</article>
