<form [formGroup]="form" (ngSubmit)="apply()" class="h-full flex flex-col justify-between">
 <div class="overflow-y-auto pr-1 max-h-[670px] custom-scroll space-y-space-md">
  <div class="flex items-center justify-between pb-space-sm border-b mp-border-outline-variant-40"><div class="flex items-center gap-2"><span class="material-symbols-outlined mp-text-primary text-[22px]">tune</span><h2 class="text-title-md font-bold mp-text-on-surface">Filtros de búsqueda</h2></div><button type="button" (click)="reset()" class="text-body-sm mp-text-secondary underline">Restablecer</button></div>
  @if(loading()){<p class="text-body-sm" role="status">Cargando catálogos oficiales…</p>}
  @if(catalogError()){<div class="rounded-lg border border-amber-500/50 p-3 text-body-sm" role="alert"><p>No fue posible cargar todos los catálogos. {{catalogError()}}</p><button type="button" class="underline font-semibold mt-2" (click)="loadCatalogs()">Reintentar</button></div>}
  <fieldset class="space-y-3" [disabled]="loading()"><legend class="text-title-sm mp-text-on-surface font-semibold mb-3">Territorio</legend>
   <label class="block text-label-sm mp-text-secondary">Departamento<select formControlName="department" (change)="departmentChanged()" class="mt-1 w-full h-10 px-3 text-body-sm mp-bg-surface-container border mp-border-outline-variant-70 rounded-lg mp-text-on-surface"><option value="">Todos</option>@for(item of departments();track item.id_departamento){<option [value]="item.id_departamento">{{item.nombre}}</option>}</select></label>
   <label class="block text-label-sm mp-text-secondary">Municipio<select formControlName="municipality" (change)="municipalityChanged()" class="mt-1 w-full h-10 px-3 text-body-sm mp-bg-surface-container border mp-border-outline-variant-70 rounded-lg mp-text-on-surface"><option value="">Todos</option>@for(item of municipalities();track item.id_municipio){<option [value]="item.id_municipio">{{item.nombre}}</option>}</select></label>
   <label class="block text-label-sm mp-text-secondary">Comunidad, vereda o resguardo<select formControlName="community" class="mt-1 w-full h-10 px-3 text-body-sm mp-bg-surface-container border mp-border-outline-variant-70 rounded-lg mp-text-on-surface"><option value="">Todas</option>@for(item of communities();track item.id_comunidad){<option [value]="item.id_comunidad">{{item.nombre}}</option>}</select></label>
  </fieldset>
  <fieldset class="space-y-3 pt-3 border-t mp-border-outline-variant-30" [disabled]="loading()"><legend class="text-title-sm mp-text-on-surface font-semibold mb-3">Clasificación</legend>
   <label class="block text-label-sm mp-text-secondary">Naturaleza<select formControlName="nature" class="mt-1 w-full h-10 px-3 text-body-sm mp-bg-surface-container border mp-border-outline-variant-70 rounded-lg mp-text-on-surface"><option value="">Todas</option><option value="problematica">Problemática comunitaria</option><option value="proyecto_iniciativa">Proyecto o iniciativa</option><option value="otro">Otro</option></select></label>
   <label class="block text-label-sm mp-text-secondary">Tipo de caso<select formControlName="type" class="mt-1 w-full h-10 px-3 text-body-sm mp-bg-surface-container border mp-border-outline-variant-70 rounded-lg mp-text-on-surface"><option value="">Todos</option>@for(item of types();track item.id_tipo_caso){<option [value]="item.id_tipo_caso">{{item.nombre}}</option>}</select></label>
   <label class="block text-label-sm mp-text-secondary">Estado<select formControlName="state" class="mt-1 w-full h-10 px-3 text-body-sm mp-bg-surface-container border mp-border-outline-variant-70 rounded-lg mp-text-on-surface"><option value="">Todos</option>@for(item of states();track item.id_estado){<option [value]="item.id_estado">{{item.nombre}}</option>}</select></label>
   <label class="block text-label-sm mp-text-secondary">Prioridad<select formControlName="priority" class="mt-1 w-full h-10 px-3 text-body-sm mp-bg-surface-container border mp-border-outline-variant-70 rounded-lg mp-text-on-surface"><option value="">Todas</option><option value="baja">Baja</option><option value="media">Media</option><option value="alta">Alta</option><option value="critica">Crítica</option></select></label>
  </fieldset>
  <fieldset class="pt-3 border-t mp-border-outline-variant-30"><legend class="text-title-sm mp-text-on-surface font-semibold mb-3">Fecha de radicación</legend><div class="grid grid-cols-2 gap-2"><label class="text-label-sm mp-text-secondary">Desde<input formControlName="from" class="mt-1 w-full p-2 border mp-border-outline-variant-70 rounded mp-bg-surface-container mp-text-on-surface" type="date"></label><label class="text-label-sm mp-text-secondary">Hasta<input formControlName="to" class="mt-1 w-full p-2 border mp-border-outline-variant-70 rounded mp-bg-surface-container mp-text-on-surface" type="date"></label></div></fieldset>
 </div>
 <div class="pt-space-md mt-space-sm border-t mp-border-outline-variant-40"><button class="w-full py-2.5 px-4 mp-bg-primary-container hover:bg-yellow-400 text-black font-bold rounded-lg" [disabled]="loading()">Aplicar filtros</button><p class="mt-3 text-body-sm" role="status">{{message()}}</p></div>
</form>
