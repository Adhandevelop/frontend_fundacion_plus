<form [formGroup]="form" (ngSubmit)="apply()" class="h-full flex flex-col justify-between">

<div class="overflow-y-auto pr-1 max-h-[670px] custom-scroll space-y-space-md">

<div class="flex items-center justify-between pb-space-sm border-b mp-border-outline-variant-40">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined mp-text-primary text-[22px]">tune</span>
<h2 class="text-title-md font-title-md font-bold mp-text-on-surface">Filtros de Búsqueda</h2>
</div>
<button type="button" (click)="reset()" class="text-body-sm font-body-sm mp-text-secondary mp-hover-text-primary transition-colors underline mp-decoration-outline-variant mp-hover-decoration-primary">
            Restablecer filtros
          </button>
</div>

<div class="space-y-3">
<label class="block text-title-sm font-title-sm mp-text-on-surface font-semibold">Territorio y Jurisdicción</label>
<div>
<span class="block text-label-sm font-label-sm mp-text-secondary mb-1">Departamento</span>
<select formControlName="department" aria-label="Departamento" class="w-full h-10 px-3 text-body-sm font-body-sm mp-bg-surface-container border mp-border-outline-variant-70 rounded-lg mp-text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container">
<option>Meta</option>
</select>
</div>
<div>
<span class="block text-label-sm font-label-sm mp-text-secondary mb-1">Municipio Priorizado</span>
<select formControlName="municipality" aria-label="Municipio" class="w-full h-10 px-3 text-body-sm font-body-sm mp-bg-surface-container border mp-border-outline-variant-70 rounded-lg mp-text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container">
<option>Villavicencio</option>
<option>Acacías</option>
<option>Granada</option>
<option>Puerto López</option>
<option>Restrepo</option>
</select>
</div>
<div>
<span class="block text-label-sm font-label-sm mp-text-secondary mb-1">Comunidad / Vereda / Resguardo</span>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 mp-text-secondary text-[18px]">location_on</span>
<input formControlName="community" aria-label="Comunidad o vereda" class="w-full pl-9 pr-3 py-2 text-body-sm font-body-sm mp-bg-surface-container border mp-border-outline-variant-70 rounded-lg mp-text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container" placeholder="Escribe el nombre del territorio..." type="text">
</div>
</div>
</div>

<div class="space-y-2 pt-2 border-t mp-border-outline-variant-30">
<label class="block text-title-sm font-title-sm mp-text-on-surface font-semibold">Naturaleza del Asunto</label>
<div class="grid grid-cols-1 gap-2">
<label class="flex items-center justify-between p-2 rounded-lg border mp-border-outline-variant-50 mp-bg-surface-container cursor-pointer mp-hover-bg-surface-container-high transition-colors">
<div class="flex items-center gap-2">
<input class="mp-text-primary-container focus:ring-primary-container mp-bg-surface-container-highest mp-border-neutral-600" name="kind" formControlName="kind" value="all" type="radio">
<span class="text-body-sm font-body-sm mp-text-on-surface font-medium">Todos los registros</span>
</div>
<span class="text-label-sm font-label-sm mp-bg-surface-container-high px-2 py-0.5 rounded-full mp-text-secondary font-bold">—</span>
</label>
<label class="flex items-center justify-between p-2 rounded-lg border-2 mp-border-primary-container mp-bg-primary-container-15 cursor-pointer">
<div class="flex items-center gap-2">
<input  class="mp-text-primary-container focus:ring-primary-container mp-bg-surface-container-highest mp-border-primary-container" name="kind" formControlName="kind" value="problem" type="radio">
<span class="text-body-sm font-body-sm mp-text-primary-container font-semibold">Problemática comunitaria</span>
</div>
<span class="text-label-sm font-label-sm mp-bg-primary-container mp-text-neutral-950 px-2 py-0.5 rounded-full font-bold">—</span>
</label>
<label class="flex items-center justify-between p-2 rounded-lg border mp-border-outline-variant-50 mp-bg-surface-container cursor-pointer mp-hover-bg-surface-container-high transition-colors">
<div class="flex items-center gap-2">
<input class="mp-text-primary-container focus:ring-primary-container mp-bg-surface-container-highest mp-border-neutral-600" name="kind" formControlName="kind" value="project" type="radio">
<span class="text-body-sm font-body-sm mp-text-on-surface">Proyecto en ejecución</span>
</div>
<span class="text-label-sm font-label-sm mp-bg-surface-container-high px-2 py-0.5 rounded-full mp-text-secondary font-bold">—</span>
</label>
</div>
</div>

<div class="space-y-2 pt-2 border-t mp-border-outline-variant-30">
<div class="flex items-center justify-between">
<label class="text-title-sm font-title-sm mp-text-on-surface font-semibold">Categoría de Impacto</label>
<span class="text-label-sm font-label-sm mp-text-secondary">{{ selectedCategories() }} seleccionadas</span>
</div>
<div class="space-y-1.5">
<label class="flex items-center gap-2.5 p-1.5 rounded mp-hover-bg-surface-container cursor-pointer">
<input formControlName="roads" class="rounded mp-text-primary-container focus:ring-primary-container mp-bg-surface-container-highest mp-border-neutral-600" type="checkbox">
<span class="material-symbols-outlined text-[19px] mp-text-primary-container">alt_route</span>
<span class="text-body-sm font-body-sm mp-text-on-surface flex-1">Infraestructura Vial y Puentes</span>
<span class="text-label-sm font-label-sm mp-text-secondary font-semibold">—</span>
</label>
<label class="flex items-center gap-2.5 p-1.5 rounded mp-hover-bg-surface-container cursor-pointer">
<input formControlName="water" class="rounded mp-text-primary-container focus:ring-primary-container mp-bg-surface-container-highest mp-border-neutral-600" type="checkbox">
<span class="material-symbols-outlined text-[19px] mp-text-primary-container">water_drop</span>
<span class="text-body-sm font-body-sm mp-text-on-surface flex-1">Agua Potable y Saneamiento</span>
<span class="text-label-sm font-label-sm mp-text-secondary font-semibold">—</span>
</label>
<label class="flex items-center gap-2.5 p-1.5 rounded mp-hover-bg-surface-container cursor-pointer">
<input formControlName="health" class="rounded mp-text-primary-container focus:ring-primary-container mp-bg-surface-container-highest mp-border-neutral-600" type="checkbox">
<span class="material-symbols-outlined text-[19px] mp-text-secondary">local_hospital</span>
<span class="text-body-sm font-body-sm mp-text-on-surface flex-1">Salud y Puestos Comunitarios</span>
<span class="text-label-sm font-label-sm mp-text-secondary font-semibold">—</span>
</label>
<label class="flex items-center gap-2.5 p-1.5 rounded mp-hover-bg-surface-container cursor-pointer">
<input formControlName="education" class="rounded mp-text-primary-container focus:ring-primary-container mp-bg-surface-container-highest mp-border-neutral-600" type="checkbox">
<span class="material-symbols-outlined text-[19px] mp-text-primary-container">school</span>
<span class="text-body-sm font-body-sm mp-text-on-surface flex-1">Educación e Infraestructura</span>
<span class="text-label-sm font-label-sm mp-text-secondary font-semibold">—</span>
</label>
<label class="flex items-center gap-2.5 p-1.5 rounded mp-hover-bg-surface-container cursor-pointer">
<input formControlName="environment" class="rounded mp-text-primary-container focus:ring-primary-container mp-bg-surface-container-highest mp-border-neutral-600" type="checkbox">
<span class="material-symbols-outlined text-[19px] mp-text-secondary">forest</span>
<span class="text-body-sm font-body-sm mp-text-on-surface flex-1">Medio Ambiente y Cuencas</span>
<span class="text-label-sm font-label-sm mp-text-secondary font-semibold">—</span>
</label>
</div>
</div>

<div class="space-y-2 pt-2 border-t mp-border-outline-variant-30">
<label class="block text-title-sm font-title-sm mp-text-on-surface font-semibold">Estado del Seguimiento</label>
<div class="space-y-2">
<label class="flex items-center justify-between p-2 rounded-lg border mp-border-outline-variant-40 mp-hover-bg-surface-container cursor-pointer">
<div class="flex items-center gap-2.5">
<span class="w-3 h-3 rounded-full mp-bg-primary-container border mp-border-neutral-900 shadow-sm"></span>
<span class="text-body-sm font-body-sm mp-text-on-surface">En Gestión Activa</span>
</div>
<input formControlName="active" class="rounded mp-text-primary-container focus:ring-primary-container mp-bg-surface-container-highest mp-border-neutral-600" type="checkbox">
</label>
<label class="flex items-center justify-between p-2 rounded-lg border mp-border-outline-variant-40 mp-hover-bg-surface-container cursor-pointer">
<div class="flex items-center gap-2.5">
<span class="w-3 h-3 rounded-full mp-bg-neutral-400"></span>
<span class="text-body-sm font-body-sm mp-text-on-surface">En Evaluación / Radicado</span>
</div>
<input formControlName="review" class="rounded mp-text-primary-container focus:ring-primary-container mp-bg-surface-container-highest mp-border-neutral-600" type="checkbox">
</label>
<label class="flex items-center justify-between p-2 rounded-lg border mp-border-outline-variant-40 mp-hover-bg-surface-container cursor-pointer">
<div class="flex items-center gap-2.5">
<span class="w-3 h-3 rounded-full bg-emerald-500"></span>
<span class="text-body-sm font-body-sm mp-text-on-surface">Resuelto / Concluido</span>
</div>
<input formControlName="resolved" class="rounded mp-text-primary-container focus:ring-primary-container mp-bg-surface-container-highest mp-border-neutral-600" type="checkbox">
</label>
</div>
</div>

<div class="space-y-2 pt-2 border-t mp-border-outline-variant-30">
<label class="block text-title-sm font-title-sm mp-text-on-surface font-semibold">Rango de Radicación</label>
<div class="grid grid-cols-2 gap-2">
<div>
<span class="text-label-sm font-label-sm mp-text-secondary">Desde</span>
<input formControlName="from" aria-label="Fecha inicial" class="w-full text-label-md font-label-md p-1.5 border mp-border-outline-variant-70 rounded mp-bg-surface-container mp-text-on-surface" type="date">
</div>
<div>
<span class="text-label-sm font-label-sm mp-text-secondary">Hasta</span>
<input formControlName="to" aria-label="Fecha final" class="w-full text-label-md font-label-md p-1.5 border mp-border-outline-variant-70 rounded mp-bg-surface-container mp-text-on-surface" type="date">
</div>
</div>
</div>
</div>

<div class="pt-space-md mt-space-sm border-t mp-border-outline-variant-40 flex items-center gap-2">
<button class="w-full py-2.5 px-4 mp-bg-primary-container hover:bg-yellow-400 mp-text-neutral-950 font-title-sm text-title-sm font-bold rounded-lg shadow-sm transition-all duration-150 active:scale-95 text-center">
          Aplicar filtros
        </button>
</div>
<p class="mt-3 text-body-sm" role="status">{{ message() }}</p></form>
