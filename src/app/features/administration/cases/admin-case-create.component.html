<div class="p-4 sm:p-6 max-w-5xl mx-auto space-y-6"><header class="space-y-2"><a routerLink="/admin" class="underline text-body-sm">Volver al dashboard</a><p class="text-label-sm uppercase tracking-wider">Gestión administrativa</p><h1 class="text-headline-md">Añadir caso</h1><p class="text-body-sm">Registra un expediente institucional. El backend generará el código de radicado y conservará la cuenta administrativa que realizó la operación.</p></header>@if(loading()){<p role="status" class="admin-panel border rounded-xl p-5">Cargando catálogos…</p>}@else{<form [formGroup]="form" (ngSubmit)="save()" class="admin-panel border rounded-xl p-5 sm:p-6 space-y-5"><label class="admin-field">Título *<input formControlName="title" maxlength="200"></label><label class="admin-field">Descripción *<textarea formControlName="description" rows="7"></textarea></label><div class="grid md:grid-cols-2 gap-4"><label class="admin-field">Tipo de caso *<select formControlName="type"><option value="">Seleccionar</option>@for(item of types();track item.id_tipo_caso){<option [value]="item.id_tipo_caso">{{item.nombre}}</option>}</select></label><label class="admin-field">Estado inicial *<select formControlName="state">@for(item of states();track item.id_estado){<option [value]="item.id_estado">{{item.nombre}}</option>}</select></label><label class="admin-field">Prioridad<select formControlName="priority"><option value="baja">Baja</option><option value="media">Media</option><option value="alta">Alta</option><option value="critica">Crítica</option></select></label><label class="admin-field">Publicación<select formControlName="publication"><option value="pendiente">Pendiente de revisión</option><option value="aprobado">Aprobado</option><option value="rechazado">Rechazado</option></select></label><label class="admin-field">Departamento *<select formControlName="department" (change)="departmentChanged()"><option value="">Seleccionar</option>@for(item of departments();track item.id_departamento){<option [value]="item.id_departamento">{{item.nombre}}</option>}</select></label><label class="admin-field">Municipio *<select formControlName="municipality" (change)="municipalityChanged()"><option value="">Seleccionar</option>@for(item of municipalities();track item.id_municipio){<option [value]="item.id_municipio">{{item.nombre}}</option>}</select></label><label class="admin-field">Comunidad *<select formControlName="community"><option value="">Seleccionar</option>@for(item of communities();track item.id_comunidad){<option [value]="item.id_comunidad">{{item.nombre}}</option>}</select></label><label class="admin-field">Dirección de referencia<input formControlName="address" maxlength="500"></label><label class="admin-field">Familias afectadas<input type="number" min="0" step="1" formControlName="families"></label><label class="admin-field">Meses de afectación<input type="number" min="0" step="1" formControlName="months"></label></div>@if(error()){<p role="alert" class="plus-form-errors">{{error()}}</p>}<div class="flex flex-wrap gap-3"><button class="admin-primary bg-yellow-400 text-black" [disabled]="saving()">{{saving()?'Creando caso…':'Crear caso'}}</button><a routerLink="/admin" class="admin-button">Cancelar</a></div></form>}</div>
