<article class="ed-news-bg-surface-container-lowest rounded-xl border ed-news-border-surface-container-highest shadow-sm overflow-hidden transition-all duration-200 hover:shadow-md">
<div class="grid grid-cols-1 lg:grid-cols-12 gap-0">
<div class="lg:col-span-7 relative min-h-[380px] lg:min-h-[460px] ed-news-bg-surface-container overflow-hidden">
<img class="w-full h-full object-cover object-center group-hover:scale-102 transition-transform duration-500" [alt]="featured().imageAlt||featured().title" loading="lazy" [src]="featured().image">
<div class="absolute top-4 left-4 flex flex-wrap gap-2">
<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full ed-news-bg-primary-container text-black font-label-md text-label-md font-bold shadow-xs">
<span class="w-1.5 h-1.5 rounded-full ed-news-bg-on-surface"></span>
                {{featured().category}}
              </span>
</div>
</div>
<div class="lg:col-span-5 p-6 lg:p-8 flex flex-col justify-between ed-news-bg-surface-container-lowest">
<div>
<div class="flex items-center gap-3 ed-news-text-secondary font-label-md text-label-md mb-3">
<span class="flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">calendar_today</span>
                  {{featured().date}}
                </span>
</div>
<h2 class="font-headline-lg text-headline-lg ed-news-text-on-surface tracking-tight mb-4 ed-news-hover-text-primary transition-colors cursor-pointer">
                {{featured().title}}
              </h2>
<p class="font-body-md text-body-md ed-news-text-secondary leading-relaxed mb-6">
                {{featured().summary}}
              </p>
</div>
<div class="flex flex-wrap items-center gap-3 pt-2">
<a class="inline-flex items-center gap-2 px-5 py-2.5 rounded-lg ed-news-bg-primary-container text-black font-title-sm text-title-sm font-semibold hover:brightness-95 transition-all shadow-xs active:scale-95" href="#news-preview" (click)="openArticle(featured(),$event)">
<span>{{featured().demo?'Ver resumen de ejemplo':'Leer publicación'}}</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</a>
</div>
</div>
</div>
</article>
