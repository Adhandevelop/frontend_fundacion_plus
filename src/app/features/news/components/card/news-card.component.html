<article class="editorial-panel rounded-xl border overflow-hidden flex flex-col h-full hover:shadow-md transition-shadow group">
  <div class="relative h-48 overflow-hidden">
    <img [src]="article().image" [alt]="article().title" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
    <span class="absolute left-3 top-3 rounded-full px-3 py-1 text-label-sm font-semibold bg-white/95 text-slate-950">{{article().category}}</span>
  </div>
  <div class="p-5 flex-1"><p class="text-label-sm opacity-75 mb-2">{{article().date}} · Publicación de ejemplo</p><h3 class="text-title-md font-bold leading-snug mb-2">{{article().title}}</h3><p class="text-body-sm opacity-80 line-clamp-3">{{article().summary}}</p></div>
  <div class="px-5 pb-5"><button type="button" (click)="open.emit(article())" class="inline-flex items-center gap-2 text-title-sm font-semibold underline underline-offset-4">Ver resumen<span class="material-symbols-outlined text-[18px]" aria-hidden="true">arrow_forward</span></button></div>
</article>
