<article class="editorial-panel rounded-xl border overflow-hidden flex flex-col h-full hover:shadow-md transition-shadow group">
  <div class="relative h-48 overflow-hidden">
    @if(article().image){<img [src]="article().image" [alt]="article().imageAlt||article().title" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">}@else{<div class="w-full h-full grid place-items-center text-body-sm p-4 text-center">Publicación institucional sin imagen de portada</div>}
    <span class="absolute left-3 top-3 rounded-full px-3 py-1 text-label-sm font-semibold bg-white/95 text-slate-950">{{article().category}}</span>
  </div>
  <div class="p-5 flex-1"><p class="text-label-sm opacity-75 mb-2">{{article().date}}{{article().demo?' · Contenido de diseño':''}}</p><h3 class="text-title-md font-bold leading-snug mb-2">{{article().title}}</h3><p class="text-body-sm opacity-80 line-clamp-3">{{article().summary}}</p></div>
  <div class="px-5 pb-5"><button type="button" (click)="open.emit(article())" class="inline-flex items-center gap-2 text-title-sm font-semibold underline underline-offset-4">{{article().demo?'Ver resumen':'Leer publicación'}}<span class="material-symbols-outlined text-[18px]" aria-hidden="true">arrow_forward</span></button></div>
</article>
