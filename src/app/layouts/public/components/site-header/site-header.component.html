<header class="bg-surface dark:bg-inverse-surface border-b border-outline-variant/30 dark:border-outline/30 docked full-width top-0 sticky z-50 shadow-sm dark:shadow-none">
<div class="w-full max-w-7xl mx-auto px-margin md:px-margin-desktop flex items-center justify-between h-16">
<a class="flex items-center gap-space-sm group" routerLink="/">
<div class="w-9 h-9 rounded-lg bg-primary-container flex items-center justify-center p-1.5 shadow-sm overflow-hidden flex-shrink-0">
<img alt="Logotipo Oficial Corporación Pluralismo Social (PLUS)" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1Wz7S_kqSBugcvarnLXJqw7Khx_VzYS2sFtPIiAE5tHUmdK1i89URfoAvsDoSng9XhyQlKk36bwbBwSdOhEGUpJUfrEEspOnWK63wFhi_4S7n0K-qvIzf31zshbLWAN3_gp6FVImollJ-1QhlVIcYL1rYKoY_unDRcEXdxUXfhwHzzCDHbYdlUZMxB2psWGXaHzN0KyeKip9ujkEuqWgWvlZgQzz3g2XeRDPojP7qOONDaIX1K9TUSlQqtQ"/>
</div>
<div class="flex flex-col">
<span class="text-title-md font-title-md font-bold tracking-tight text-on-surface dark:text-inverse-on-surface leading-none">
            PLUS
          </span>
<span class="hidden sm:block text-label-sm font-label-sm text-secondary dark:text-secondary-fixed tracking-tight mt-0.5">
            Corporación Pluralismo Social
          </span>
</div>
</a>
<nav aria-label="Navegación principal" class="hidden xl:flex items-center gap-space-md">
<a class="text-on-surface dark:text-inverse-on-surface font-semibold py-1 text-label-md font-label-md" routerLink="/" fragment="inicio" routerLinkActive="border-b-2 border-primary-container" [routerLinkActiveOptions]="{exact:true}">
          Inicio
        </a>
<a class="text-secondary dark:text-secondary-fixed hover:text-on-surface dark:hover:text-inverse-on-surface py-1 transition-colors text-label-md font-label-md" routerLink="/mapa" routerLinkActive="border-b-2 border-primary-container">
          Mapa de casos
        </a>
<a class="text-secondary dark:text-secondary-fixed hover:text-on-surface dark:hover:text-inverse-on-surface py-1 transition-colors text-label-md font-label-md" routerLink="/iniciativas" routerLinkActive="border-b-2 border-primary-container">Iniciativas</a><a class="text-secondary dark:text-secondary-fixed hover:text-on-surface dark:hover:text-inverse-on-surface py-1 text-label-md font-label-md" routerLink="/noticias" routerLinkActive="border-b-2 border-primary-container">
          Noticias
        </a>
<a class="text-secondary dark:text-secondary-fixed hover:text-on-surface dark:hover:text-inverse-on-surface py-1 transition-colors text-label-md font-label-md" routerLink="/nosotros" routerLinkActive="border-b-2 border-primary-container">
          Nosotros
        </a>
<a class="text-secondary dark:text-secondary-fixed hover:text-on-surface dark:hover:text-inverse-on-surface py-1 transition-colors text-label-md font-label-md" routerLink="/" fragment="contacto">
          Contacto
        </a>
</nav>
<div class="flex items-center gap-2 sm:gap-space-md">
<button aria-label="Cambiar tema de color" class="flex items-center p-1 rounded-full border border-outline-variant/30 dark:border-outline/30 bg-surface-container-low dark:bg-inverse-surface transition-all duration-150" id="theme-toggle" (click)="theme.toggle()" [attr.aria-pressed]="theme.dark()" type="button">
<span class="p-1 rounded-full bg-primary-container text-on-primary-fixed flex items-center justify-center transition-all duration-150" id="sun-icon-wrap" [class.bg-primary-container]="!theme.dark()">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
</span>
<span class="p-1 rounded-full text-secondary dark:text-secondary-fixed flex items-center justify-center transition-all duration-150" id="moon-icon-wrap" [class.bg-primary-container]="theme.dark()">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false"><path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z"/></svg>
</span>
</button>
<a class="hidden lg:inline-flex items-center justify-center px-4 py-2 border border-outline-variant/50 dark:border-outline/50 rounded-lg text-title-sm font-title-sm text-on-surface dark:text-inverse-on-surface hover:bg-surface-container dark:hover:bg-surface-container-high transition-colors duration-150" routerLink="/login">
          Iniciar sesión
        </a>
<a class="inline-flex items-center justify-center px-4 py-2 rounded-lg bg-primary-container hover:brightness-95 text-on-primary-fixed font-title-sm text-title-sm shadow-sm transition-all duration-150 active:scale-95" routerLink="/registro">
          Registrarse
        </a>
</div>
</div>
<div class="xl:hidden border-t border-outline-variant/30 px-4 py-2"><button type="button" (click)="menuOpen.set(!menuOpen())" [attr.aria-expanded]="menuOpen()" aria-controls="mobile-nav" class="flex items-center gap-2 text-title-sm"><span class="material-symbols-outlined">menu</span> Menú</button>
@if(menuOpen()) {<nav id="mobile-nav" aria-label="Navegación móvil" class="grid gap-3 py-4" (click)="menuOpen.set(false)"><a routerLink="/" fragment="inicio" routerLinkActive="border-b-2 border-primary-container" [routerLinkActiveOptions]="{exact:true}">Inicio</a><a routerLink="/mapa" routerLinkActive="border-b-2 border-primary-container">Mapa de casos</a><a routerLink="/iniciativas" routerLinkActive="border-b-2 border-primary-container">Iniciativas</a><a routerLink="/noticias" routerLinkActive="border-b-2 border-primary-container">Noticias</a><a routerLink="/nosotros" routerLinkActive="border-b-2 border-primary-container">Nosotros</a><a routerLink="/" fragment="contacto">Contacto</a><a routerLink="/login">Iniciar sesión</a></nav>}</div></header>
