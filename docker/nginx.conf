server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Conservar /api/ y evitar que las reglas de archivos estaticos lo intercepten.
    location ^~ /api/ {
        proxy_pass http://backend:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # Angular resuelve las rutas al recargar o abrir una URL directamente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Los recursos inexistentes devuelven 404 en lugar del HTML de Angular.
    location ~* \.(?:css|js|map|json|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf)$ {
        try_files $uri =404;
    }
}
