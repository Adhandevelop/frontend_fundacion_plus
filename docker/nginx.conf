server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular resuelve las rutas al recargar o abrir una URL directamente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Los recursos inexistentes devuelven 404 en lugar del HTML de Angular.
    location ~* \.(?:css|js|map|json|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf)$ {
        try_files $uri =404;
    }
}
